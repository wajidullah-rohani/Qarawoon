<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کړاوونه — د پښتو شعرونو ټولګه</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1b4d40" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="کړاوونه" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />

  <link rel="stylesheet" href="./css/style.css" />

  <style>
    :root {
      --q-emerald: #1b4d40;
      --q-emerald-dark: #0f2922;
      --q-gold: #e6c373;
      --q-cream: #fdf8ec;
    }

    .qarawoon-install-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px auto;
      padding: 12px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--q-emerald), var(--q-emerald-dark));
      color: var(--q-cream);
      border: 1px solid rgba(230, 195, 115, 0.45);
      box-shadow: 0 8px 20px rgba(15, 41, 34, 0.25);
    }

    .qarawoon-install-bar.is-visible {
      display: flex;
    }

    .qarawoon-install-btn {
      background: linear-gradient(135deg, #f3d48c, #c29238);
      color: #0f2922;
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="qarawoonInstallBar" class="qarawoon-install-bar" role="region" aria-label="د اپلیکیشن نصبول">
    <div>
      <strong>کړاوونه اپلیکیشن نصب کړئ</strong>
      <div style="font-size: 0.9rem; opacity: 0.9;">په وړیا ډول یې د خپل موبایل په سکرین کې وساتئ</div>
    </div>
    <button id="qarawoonInstallBtn" class="qarawoon-install-btn" type="button">نصبول</button>
  </div>

  <main id="app"></main>

  <script src="./supabase-config.js"></script>
  <script src="./js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    (function () {
      let deferredPrompt = null;
      const installBar = document.getElementById("qarawoonInstallBar");
      const installBtn = document.getElementById("qarawoonInstallBtn");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBar) {
          installBar.classList.add("is-visible");
        }
      });

      if (installBtn) {
        installBtn.addEventListener("click", async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          if (installBar) {
            installBar.classList.remove("is-visible");
          }
        });
      }

      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        if (installBar) {
          installBar.classList.remove("is-visible");
        }
      });
    })();
  </script>
</body>
</html>
