<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <title>کړاوونه | د پښتو شعرونو او ادبي شېبو ټولګه</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-emblem" aria-hidden="true">ک</div>
        <div>
          <h1 class="brand-title">کړاوونه</h1>
          <p class="brand-subtitle">د پښتو شعرونو، غزلونو او ادبي شېبو ټولګه</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" id="theme-toggle-btn" class="btn-ghost" aria-label="د شپې او ورځې حالت بدلول">
          د شپې حالت
        </button>
        <a href="admin.html" class="admin-link">مدیریت</a>
      </div>
    </div>
  </header>

  <main class="container main-layout">
    <!-- Search, Category Filter & Reader Controls -->
    <section class="toolbar-card" aria-label="د شعرونو لټون او لوستلو تنظیمات">
      <div class="search-box">
        <label for="search-input" class="sr-only">د شعر سرلیک، شاعر یا متن ولټوئ</label>
        <input
          type="search"
          id="search-input"
          placeholder="د شعر سرلیک، شاعر یا بیت ولټوئ..."
          autocomplete="off"
        />
      </div>

      <div class="filter-box">
        <label for="category-select" class="sr-only">کټګوري وټاکئ</label>
        <select id="category-select">
          <option value="all">ټولې کټګورۍ</option>
        </select>
      </div>

      <div class="font-controls" role="group" aria-label="د لیک اندازه">
        <button type="button" id="font-dec-btn" class="btn-ghost" title="لیک کوچنی کول">A-</button>
        <button type="button" id="font-reset-btn" class="btn-ghost" title="عادي اندازه">A</button>
        <button type="button" id="font-inc-btn" class="btn-ghost" title="لیک لوی کول">A+</button>
      </div>
    </section>

    <!-- Poems Section -->
    <section aria-labelledby="poems-heading">
      <div class="section-heading">
        <h2 id="poems-heading">خپاره شوي شعرونه</h2>
        <span class="section-line"></span>
      </div>

      <div id="poems-container" class="poems-grid">
        <div class="loading-state">
          <p>شعرونه لودېږي...</p>
        </div>
      </div>
    </section>

    <!-- Reader Feedback Section -->
    <section id="feedback-section" class="feedback-card" aria-labelledby="feedback-heading">
      <div class="feedback-header">
        <h2 id="feedback-heading">نظر او پیغام</h2>
        <p>خپل نظر، وړاندیز یا ادبي پیغام له موږ سره شریک کړئ.</p>
      </div>

      <form id="feedback-form" novalidate>
        <div class="form-group">
          <label for="feedback-name">ستاسو نوم</label>
          <input type="text" id="feedback-name" maxlength="100" required placeholder="خپل نوم ولیکئ..." />
        </div>

        <div class="form-group">
          <label for="feedback-message">ستاسو نظر یا پیغام</label>
          <textarea
            id="feedback-message"
            rows="4"
            maxlength="2000"
            required
            placeholder="خپل نظر یا پیغام ولیکئ..."
          ></textarea>
        </div>

        <button type="submit" id="feedback-submit-btn" class="btn-primary">لېږل</button>
        <p id="feedback-status" class="feedback-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>کړاوونه — د پښتو ادب او شعر د مینوالو لپاره</p>
    </div>
  </footer>

  <!-- Poem Reader Modal -->
  <div id="poem-modal" class="modal-backdrop" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-poem-title">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <span id="modal-poem-category" class="poem-badge">شعر</span>
          <h2 id="modal-poem-title" class="modal-title"></h2>
          <p id="modal-poem-poet" class="poem-poet"></p>
        </div>
        <button type="button" id="modal-close-btn" class="btn-ghost" aria-label="بندول">✕</button>
      </div>

      <div id="modal-poem-body" class="poem-body modal-body"></div>

      <div class="modal-actions">
        <button type="button" id="modal-copy-btn" class="btn-primary">شعر کاپي کول</button>
        <span id="copy-feedback" class="copy-feedback" role="status" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
