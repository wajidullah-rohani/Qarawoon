  <style>
    :root {
      --emerald: #1b4d40;
      --emerald-deep: #0f2922;
      --emerald-soft: #246151;
      --gold: #e4be67;
      --gold-bright: #f4d78e;
      --gold-dark: #b8882e;
      --cream: #fcf8ee;
      --paper: #fffdf8;
      --ink: #172722;
      --muted: #556862;
      --border: rgba(27, 77, 64, 0.16);
      --shadow: 0 12px 30px rgba(15, 41, 34, 0.1);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #f7f1e1 0%, #efe7d4 100%);
      color: var(--ink);
      font-family: "Noto Naskh Arabic", "Amiri", serif;
      line-height: 1.9;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Install Banner */
    .install-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 14px 18px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--emerald), var(--emerald-deep));
      color: var(--cream);
      border: 1px solid rgba(228, 190, 103, 0.45);
      box-shadow: var(--shadow);
    }

    .install-bar.show {
      display: flex;
    }

    .install-bar-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--gold-bright);
    }

    .install-bar-sub {
      font-size: 0.9rem;
      color: rgba(252, 248, 238, 0.9);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold-dark));
      color: var(--emerald-deep);
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-emerald {
      background: linear-gradient(135deg, var(--emerald-soft), var(--emerald));
      color: var(--cream);
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
