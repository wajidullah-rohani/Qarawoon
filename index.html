<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کړاوونه — د پښتو شعرونو ټولګه</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>کړاوونه</h1>
    <p id="about-text">د پښتو شعرونو او ادبي شېبو آنلاین ټولګه</p>
    <nav id="social-links"></nav>
  </header>

  <main class="container">
    <section id="poems-list" class="poems-list">
      <p>شعرونه لودېږي...</p>
    </section>

    <section class="feedback-section">
      <h2>نظر او پیغام</h2>
      <form id="feedback-form">
        <input type="text" id="sender-name" placeholder="ستاسو نوم" required />
        <textarea id="feedback-message" placeholder="خپل نظر یا پیغام ولیکئ..." required></textarea>
        <button type="submit">لېږل</button>
      </form>
      <p id="feedback-status"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
